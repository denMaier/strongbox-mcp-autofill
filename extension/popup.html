<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Strongbox MCP AutoFill</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>
<p id="site" class="site" hidden></p>
<p id="message" class="busy" role="status">Asking Strongbox…</p>
<ul id="matches" aria-label="Logins"></ul>
<ul id="vaults" aria-label="Locked vaults"></ul>
<div class="actions"><button id="retry" hidden>Try again</button><button id="cancel" class="secondary" hidden>Cancel</button></div>
<script src="popup.js"></script>
</body>
</html>
