name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension:
    runs-on: macos-15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: npm run build

  bridge:
    runs-on: macos-15
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - run: swift test
